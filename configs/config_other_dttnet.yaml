audio:
  chunk_size: 261120
  dim_f: 2048
  dim_t: 256
  hop_length: 1024
  n_fft: 6144
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.001

model:
  model_type: dp_tdf
  num_blocks: 5
  l: 3
  g: 32
  k: 3
  bn: 8
  bias: false
  bn_norm: BN
  block_type: TFC_TDF_Res2
  bandsequence:
    rnn_type: LSTM
    bidirectional: true
    num_layers: 4
    n_heads: 2

training:
  batch_size: 6
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
  - other
  - vocals
  lr: 0.0001
  patience: 2
  reduce_factor: 0.95
  target_instrument: other
  num_epochs: 1000
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true
  mixup_probs: !!python/tuple
    - 0.2
    - 0.02
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5

inference:
  batch_size: 1
  dim_t: 256
  num_overlap: 4
